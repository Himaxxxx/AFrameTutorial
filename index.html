<!DOCTYPE html> 
 
<html> 
 
<head> 
 
  <meta charset="utf-8"> 
 
  <title>My A-Frame World</title> 
 
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

</head> 
 
<body> 
 
  <a-scene> 
 
    <a-box 
      position="0 1 -3" 
      color="#ff2a8a"> 
    </a-box> 

    <a-plane 
      position="0 0 -4" 
      rotation="-90 0 0" 
      width="10" 
      height="10" 
      color="#ff6a00"> 
    </a-plane> 
 
    <a-sky color="#241b2f"></a-sky> 
    
    <a-entity environment ="
      active: true;
      preset: egypt;
      seed: 2;
      skyType: gradient;
      skyColor: #A1D1C2;
      horizonColor: #D46A1E;
      lighting: distant;
      shadow: true;
      shadowBias: 0.005;
      shadowSize: 10;
      lightPositions: 0 1 -0.2;
      fog: 0.005;
      flatShading: true;
      playArea: 1;
      stageSize: 200;
      groundTexture: walkernoise;
      groundFrequency: 12;
      dressingVariation: 1 1 1;
      dressing UniformScale: false;
    " ></a-entity>
 
  </a-scene> 
 
</body> 
 
</html>
